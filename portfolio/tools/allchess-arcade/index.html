<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#294c39" />
    <meta name="description" content="AllChess in the browser: bot and pass-and-play games for chess and board games from around the world, with 3D tabletops." />
    <title>AllChess Arcade</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      (() => {
        // Relative asset URLs need a directory URL: /play/allchess -> /play/allchess/
        const path = window.location.pathname;
        if (!path.endsWith("/") && !/\.[a-z0-9]+$/i.test(path)) {
          window.location.replace(path + "/" + window.location.search + window.location.hash);
          return;
        }
        try {
          const stored = window.localStorage.getItem("allchess-theme");
          const choice = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          const resolved = choice === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : choice;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><p class="arcade-boot" role="status">Opening AllChess…</p></div>
    <noscript>AllChess Arcade needs JavaScript to run the boards.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
