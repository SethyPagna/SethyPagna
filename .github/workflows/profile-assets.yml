# Rebuilds the live profile graphics (activity card + contribution skyline) and publishes them to the
# `output` branch, which README.md reads through raw.githubusercontent.com.
name: Profile assets

on:
  schedule:
    - cron: "17 0 * * *" # daily at 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stats.py
      - scripts/outline.py
      - scripts/fonts/**
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the text outliner
        run: python -m pip install fonttools==4.66.0 uharfbuzz==0.56.2

      - name: Draw the activity card and skyline
        run: python scripts/stats.py dist "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update profile activity graphics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
